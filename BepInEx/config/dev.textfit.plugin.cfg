## Settings file was created by plugin TextFit v1.0.0
## Plugin GUID: dev.textfit.plugin

[Dialogue]

## Rewrap dialogue based on where the nameplate is: left speaker gets wider lines (portrait doesn't block the right side); right speaker gets narrower lines (avoid running under the portrait).
# Setting type: Boolean
# Default value: true
SideAwareWrap = true

## Max characters per line when the speaker's nameplate is on the LEFT.
# Setting type: Int32
# Default value: 46
LeftSpeakerLineWidth = 46

## Max characters per line when the speaker's nameplate is on the RIGHT (avoid overlapping the portrait).
# Setting type: Int32
# Default value: 30
RightSpeakerLineWidth = 30

## GameObject name of the dialogue text component.
# Setting type: String
# Default value: TalkText
SpeakerTextObject = TalkText

## GameObject name of the nameplate. Used to determine left/right speaker.
# Setting type: String
# Default value: Name
SpeakerNameObject = Name

## Immediate parent name of the visible dialogue Text component. Confirmed via runtime hierarchy dump: dialogue body lives at Talk_UI/Talk/Background/Balabala/Text.
# Setting type: String
# Default value: Balabala
DialogueParentName = Balabala

## Fixed point size for dialogue text (TalkText). Enforced every scan so the game cannot resize it. Derived from 45pt Chinese authored size * BodyFontScale.
# Setting type: Int32
# Default value: 38
DialogueFontSize = 38

[Fonts]

## Name of the font asset to use for body text (dialogue, descriptions). Empty = leave alone.
# Setting type: String
# Default value: 
BodyFontName = 方正北魏楷书_gbk

## Comma-separated GameObject names that should use the body font.
# Setting type: String
# Default value: TalkText,Description_Text,DetailImageText,Content,Target
BodyTextObjects = TalkText,Description_Text,DetailImageText,Content,Target

## Size correction for body text. Aleo renders larger than the CJK font it replaces at the same point size; 1.0 disables.
# Setting type: Single
# Default value: 0.85
BodyFontScale = 0.85

## Font asset to use for headings and names (the display face). Empty = leave alone.
# Setting type: String
# Default value: 
TitleFontName = 方正魏碑_GBK

## Comma-separated GameObject names that should use the title font.
# Setting type: String
# Default value: NameText
TitleTextObjects = NameText

## Windows-installed font FAMILY to use for body text. A family gives Unity a real Bold face, so <b> stops being faked. Empty = use the embedded asset instead.
# Setting type: String
# Default value: Aleo
OSFontName = 

[General]

## Shrink text automatically so it fits inside its box.
# Setting type: Boolean
# Default value: true
EnableAutoSize = true

## Enable rich text tags (<b>, <color>, ...) on all text components.
# Setting type: Boolean
# Default value: true
EnableRichText = true

## Smallest allowed size as a fraction of the original font size.
# Setting type: Single
# Default value: 0.55
MinSizeRatio = 0.55

## How often to scan for newly created text objects.
# Setting type: Single
# Default value: 1
RescanSeconds = 1

## Log every UI Image and its sprite name, so brush-art labels can be identified for replacement.
# Setting type: Boolean
# Default value: true
LogSprites = true

## Smallest point size a shrunk-to-fit label may reach.
# Setting type: Int32
# Default value: 14
MinLabelSize = 14

## Only text this short counts as a label. Longer text is left to wrap instead of being shrunk.
# Setting type: Int32
# Default value: 25
MaxLabelChars = 25

## Hardest a label may be shrunk, as a fraction of its original size.
# Setting type: Single
# Default value: 0.55
MaxShrink = 0.55

## Comma-separated GameObject names that must keep their full size. Supports Name@170 (width-qualified) and Setting* (prefix).
# Setting type: String
# Default value: 
NoShrinkObjects = Name@100,NameText,Setting*,Value@160

## Comma-separated GameObject names whose text should break only after a sentence ends.
# Setting type: String
# Default value: DetailImageText
SentenceBreakObjects = DetailImageText

## Comma-separated Name:pixels entries. Widens a component's rect so long text fits at full size instead of shrinking or clipping.
# Setting type: String
# Default value: 
WidenObjects = 

## How often to run the sprite-swap pass. Lower = selected states change faster.
# Setting type: Single
# Default value: 0.1
SpriteRescanSeconds = 0.1

## Shrink body text that overflows its box vertically, so it stops colliding with elements above.
# Setting type: Boolean
# Default value: true
FitBodyHeight = true

## Comma-separated parent GameObject names. A body-text child of one of these is treated as a sub-item and scaled down (see SubItemBodyScale). Lets the quest-objective list render smaller than the quest description above it.
# Setting type: String
# Default value: Objective
SubItemParents = Objective,TargetWrapper,Notification

## Extra scale multiplier applied to body-text children of a SubItemParents parent. 0.55 = roughly half the size of the surrounding brown text.
# Setting type: Single
# Default value: 0.55
SubItemBodyScale = 0.55

## Let short labels in narrow boxes shrink onto one line instead of stacking into a column.
# Setting type: Boolean
# Default value: true
NoWrapShortLabels = true

[Sprites]

## Folder of PNG replacements. Each file is named after the sprite it replaces.
# Setting type: String
# Default value: L:\Games\The Forgotten Concluder\BepInEx\plugins\TextFit_Sprites
SpriteDir = L:\Games\The Forgotten Concluder\BepInEx\plugins\TextFit_Sprites

